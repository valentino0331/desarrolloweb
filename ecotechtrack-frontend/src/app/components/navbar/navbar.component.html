<header class="navbar-wrapper">
  <div class="navbar-container">
    <a routerLink="/dashboard" class="brand">
      <div class="brand-icon">
        <i class="bi bi-recycle"></i>
      </div>
      <div class="brand-text">
        <span class="brand-title">EcoTechTrack</span>
        <span class="brand-sub">Trazabilidad RAEE</span>
      </div>
    </a>

    <nav class="nav-links" *ngIf="authService.isAuthenticated()">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/residuos" routerLinkActive="active" class="nav-link">
        <i class="bi bi-boxes"></i>
        <span>Residuos RAEE</span>
      </a>
      <a routerLink="/almacenes" routerLinkActive="active" class="nav-link">
        <i class="bi bi-building"></i>
        <span>Almacenes</span>
      </a>
      <a routerLink="/empresas" routerLinkActive="active" class="nav-link">
        <i class="bi bi-truck"></i>
        <span>Operadores MINAM</span>
      </a>
    </nav>

    <div class="user-actions">
      <ng-container *ngIf="authService.currentUserSignal() as user; else anonView">
        <div class="user-profile">
          <div class="user-avatar" [title]="user.nombreCompleto">
            {{ user.nombreCompleto.charAt(0).toUpperCase() }}
          </div>
          <div class="user-details">
            <span class="user-name">{{ user.nombreCompleto }}</span>
            <span class="role-badge" [ngClass]="getHighestRole(user.roles).class">
              {{ getHighestRole(user.roles).label }}
            </span>
          </div>
        </div>

        <button (click)="logout()" class="btn-logout" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
          <span>Salir</span>
        </button>
      </ng-container>

      <ng-template #anonView>
        <div class="auth-buttons">
          <a routerLink="/login" class="btn btn-secondary btn-sm">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Iniciar Sesión</span>
          </a>
          <a routerLink="/register" class="btn btn-primary btn-sm">
            <i class="bi bi-person-plus"></i>
            <span>Registrarse</span>
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</header>
