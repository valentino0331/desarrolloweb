# ===============================================
# Configuración Servidor Web Embebido (Tomcat)
# ===============================================
server.port=8080
server.servlet.context-path=

# ===============================================
# Configuración Base de Datos H2 en Memoria
# ===============================================
spring.datasource.url=jdbc:h2:mem:ecotechtrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================================
# Configuración Spring Data JPA e Hibernate
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# Formato JSON Jackson
# ===============================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima
