# ===============================================
# Configuración Servidor Web Embebido (Tomcat)
# ===============================================
server.port=8080
server.servlet.context-path=

# ===============================================
# Configuración Base de Datos H2 en Memoria
# ===============================================
spring.datasource.url=jdbc:h2:mem:ecotechtrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================================
# Configuración Spring Data JPA e Hibernate
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# Formato JSON Jackson
# ===============================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima

# ===============================================
# Configuración de Seguridad y Tokens JWT
# ===============================================
# Clave secreta HMAC-SHA de al menos 256 bits (32 bytes)
app.jwt.secret=9a7c3b2e1f8d4a6c0e5b7a9d3f1c4e6a8b0d2f4e6a8c0e2b4d6f8a0c2e4b6d8f
# Tiempo de expiración del token en milisegundos (24 horas = 86400000 ms)
app.jwt.expiration-ms=86400000

